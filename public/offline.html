<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Offline • Sora</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #F0EBE1;
      color: #1C1917;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #F8F5EF;
      border: 1px solid rgba(78, 94, 78, 0.15);
      border-radius: 36px;
      padding: 40px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(28, 25, 23, 0.08);
    }
    .icon-wrapper {
      width: 72px;
      height: 72px;
      background: #E8EDE8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: #4E5E4E;
    }
    h1 {
      font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
      font-size: 26px;
      font-weight: 600;
      color: #1C1917;
      letter-spacing: -0.02em;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #57534E;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #4E5E4E;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 500;
      padding: 14px 28px;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.15s ease, transform 0.1s ease;
      box-shadow: 0 4px 12px rgba(78, 94, 78, 0.25);
    }
    .btn:active {
      transform: scale(0.98);
      background: #3F4D3F;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrapper">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>No Connection</h1>
    <p>Sora needs an internet connection to stream music. Reconnect and tap below to resume your session.</p>
    <button class="btn" onclick="retryConnection()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      Retry Connection
    </button>
  </div>

  <script>
    function retryConnection() {
      const target = 'https://sora-audio.pages.dev';
      if (window.location.href.includes('offline.html')) {
        window.location.href = target;
      } else {
        window.location.reload();
      }
    }

    // Auto-reload when network reconnects
    window.addEventListener('online', retryConnection);
  </script>
</body>
</html>
